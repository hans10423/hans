<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarMatch — 나만의 자동차 브랜드 찾기</title>
  <meta name="description" content="소비자 기호에 맞는 자동차 브랜드를 추천해드립니다. 간단한 4가지 질문으로 나에게 딱 맞는 브랜드를 발견하세요." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #07070f;
      --bg2:      #0e0e1c;
      --bg3:      #141428;
      --surface:  rgba(255,255,255,0.04);
      --border:   rgba(255,255,255,0.08);
      --blue:     #4f8ef7;
      --purple:   #a259ff;
      --cyan:     #22d3ee;
      --text:     #f0f0f8;
      --muted:    #8888aa;
      --grad:     linear-gradient(135deg, #4f8ef7, #a259ff);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans KR', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Noise overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: .5;
    }

    /* ── Glow orbs ── */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(120px); pointer-events: none; z-index: 0;
    }
    .orb-1 { width: 600px; height: 600px; background: rgba(79,142,247,.12); top: -200px; left: -200px; }
    .orb-2 { width: 500px; height: 500px; background: rgba(162,89,255,.10); bottom: -150px; right: -150px; }

    /* ══════════════ HERO ══════════════ */
    #hero {
      position: relative; min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      z-index: 1;
    }

    .hero-bg {
      position: absolute; inset: 0; overflow: hidden;
    }
    .hero-bg img {
      width: 100%; height: 100%; object-fit: cover;
      opacity: .18; filter: saturate(1.4) brightness(.7);
      transition: opacity 1s;
    }
    .hero-bg::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(7,7,15,.2) 0%, rgba(7,7,15,.85) 100%);
    }

    .hero-badge {
      display: inline-flex; align-items: center; gap: .5rem;
      border: 1px solid rgba(79,142,247,.4);
      background: rgba(79,142,247,.08);
      border-radius: 999px; padding: .35rem 1rem;
      font-size: .78rem; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; color: var(--blue);
      margin-bottom: 1.8rem; backdrop-filter: blur(8px);
      animation: fadeUp .7s ease both;
    }
    .hero-badge span { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); animation: pulse 2s infinite; }

    h1.hero-title {
      font-size: clamp(2.6rem, 7vw, 5.5rem);
      font-weight: 900; line-height: 1.08;
      letter-spacing: -.03em;
      animation: fadeUp .7s .1s ease both;
    }
    h1.hero-title .grad { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .hero-sub {
      max-width: 560px; margin: 1.4rem auto 2.8rem;
      font-size: 1.1rem; color: var(--muted); line-height: 1.7;
      font-weight: 400;
      animation: fadeUp .7s .2s ease both;
    }

    .btn-primary {
      display: inline-flex; align-items: center; gap: .7rem;
      background: var(--grad); color: #fff;
      border: none; border-radius: 999px;
      padding: 1rem 2.4rem; font-size: 1.05rem; font-weight: 700;
      cursor: pointer; transition: transform .2s, box-shadow .2s;
      box-shadow: 0 0 40px rgba(79,142,247,.3);
      animation: fadeUp .7s .3s ease both;
      font-family: inherit; letter-spacing: -.01em;
    }
    .btn-primary:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 0 60px rgba(79,142,247,.45); }
    .btn-primary:active { transform: scale(.97); }
    .btn-icon { font-size: 1.3rem; }

    .hero-brands {
      display: flex; gap: 2rem; margin-top: 4rem;
      flex-wrap: wrap; justify-content: center;
      animation: fadeUp .7s .5s ease both;
    }
    .hero-brand-chip {
      font-size: .8rem; color: var(--muted); letter-spacing: .04em;
    }
    .hero-brands .sep { color: rgba(255,255,255,.15); }

    /* ══════════════ QUIZ ══════════════ */
    #quiz {
      display: none; position: relative; z-index: 1;
      min-height: 100vh; padding: 2rem 1rem 4rem;
      align-items: center; justify-content: center; flex-direction: column;
    }
    #quiz.active { display: flex; }

    .quiz-wrap {
      width: 100%; max-width: 760px;
    }

    .quiz-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 2.4rem;
    }
    .quiz-step-label {
      font-size: .8rem; color: var(--muted); font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase;
    }
    .quiz-back-btn {
      background: none; border: 1px solid var(--border);
      border-radius: 999px; color: var(--muted);
      padding: .4rem .9rem; font-size: .82rem; cursor: pointer;
      font-family: inherit; transition: all .2s;
    }
    .quiz-back-btn:hover { border-color: var(--blue); color: var(--blue); }

    /* Progress bar */
    .progress-track {
      width: 100%; height: 4px; background: rgba(255,255,255,.06);
      border-radius: 2px; margin-bottom: 2.8rem; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--grad);
      border-radius: 2px; transition: width .5s cubic-bezier(.72,.18,.24,.98);
    }

    .quiz-q {
      font-size: clamp(1.35rem, 4vw, 1.9rem);
      font-weight: 800; margin-bottom: .6rem;
      letter-spacing: -.02em; line-height: 1.3;
    }
    .quiz-q-sub { font-size: .95rem; color: var(--muted); margin-bottom: 2rem; }

    .options-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media(max-width:500px){ .options-grid { grid-template-columns: 1fr; } }

    .option-card {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 1.2rem; padding: 1.4rem 1.2rem;
      cursor: pointer; transition: all .22s cubic-bezier(.4,0,.2,1);
      display: flex; align-items: flex-start; gap: 1rem;
      backdrop-filter: blur(10px);
      animation: fadeUp .4s ease both;
    }
    .option-card:hover {
      border-color: var(--blue); background: rgba(79,142,247,.08);
      transform: translateY(-3px); box-shadow: 0 8px 30px rgba(79,142,247,.15);
    }
    .option-card.selected {
      border-color: var(--blue); background: rgba(79,142,247,.12);
      box-shadow: 0 0 0 4px rgba(79,142,247,.18), 0 8px 30px rgba(79,142,247,.2);
    }
    .opt-icon { font-size: 2rem; flex-shrink: 0; }
    .opt-texts {}
    .opt-title { font-size: 1rem; font-weight: 700; margin-bottom: .2rem; }
    .opt-desc { font-size: .82rem; color: var(--muted); line-height: 1.5; }

    .quiz-next-wrap { margin-top: 2rem; text-align: right; }
    .btn-next {
      background: var(--grad); color: #fff; border: none;
      border-radius: 999px; padding: .85rem 2rem;
      font-size: .98rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: all .2s;
      box-shadow: 0 4px 20px rgba(79,142,247,.25);
      opacity: 0; pointer-events: none; transform: translateY(6px);
      transition: all .3s;
    }
    .btn-next.visible { opacity: 1; pointer-events: auto; transform: none; }
    .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(79,142,247,.4); }

    /* ══════════════ RESULTS ══════════════ */
    #results {
      display: none; position: relative; z-index: 1;
      padding: 4rem 1.5rem 6rem;
    }
    #results.active { display: block; }

    .results-header {
      text-align: center; margin-bottom: 1rem;
    }
    .results-eyebrow {
      font-size: .78rem; font-weight: 700; letter-spacing: .10em;
      text-transform: uppercase; color: var(--blue);
      margin-bottom: .8rem;
    }
    .results-title {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 900; letter-spacing: -.03em; line-height: 1.1;
      margin-bottom: 1rem;
    }
    .results-sub { color: var(--muted); font-size: 1rem; margin-bottom: 3rem; }

    /* TOP 3 podium */
    .podium {
      display: grid; grid-template-columns: 1fr 1.1fr 1fr;
      gap: 1rem; max-width: 900px; margin: 0 auto 4rem;
      align-items: end;
    }
    @media(max-width:600px){ .podium { grid-template-columns: 1fr; align-items: stretch; } }

    .podium-card {
      border-radius: 1.5rem; overflow: hidden;
      border: 1.5px solid var(--border);
      position: relative; cursor: pointer;
      transition: transform .3s, box-shadow .3s;
    }
    .podium-card:hover { transform: translateY(-6px); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .podium-card.rank-1 {
      border-color: rgba(250,200,50,.4);
      box-shadow: 0 0 40px rgba(250,200,50,.15);
    }
    .podium-card.rank-2 { border-color: rgba(180,180,200,.3); }
    .podium-card.rank-3 { border-color: rgba(200,140,80,.3); }

    .podium-img-wrap {
      width: 100%; aspect-ratio: 16/9; overflow: hidden; position: relative;
    }
    .podium-img-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .5s; filter: brightness(.85) saturate(1.1);
    }
    .podium-card:hover .podium-img-wrap img { transform: scale(1.06); }
    .podium-img-wrap::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.8) 0%, transparent 55%);
    }

    .podium-rank-badge {
      position: absolute; top: .8rem; left: .8rem;
      font-size: .72rem; font-weight: 800; letter-spacing: .06em;
      text-transform: uppercase; padding: .3rem .75rem;
      border-radius: 999px; z-index: 2;
    }
    .rank-1 .podium-rank-badge { background: rgba(250,200,50,.9); color: #111; }
    .rank-2 .podium-rank-badge { background: rgba(200,200,220,.85); color: #111; }
    .rank-3 .podium-rank-badge { background: rgba(200,140,80,.85); color: #fff; }

    .match-percent {
      position: absolute; bottom: .8rem; right: .8rem;
      font-size: 1.5rem; font-weight: 900; z-index: 2;
      text-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    .rank-1 .match-percent { color: #fac832; }
    .rank-2 .match-percent { color: #d0d0e0; }
    .rank-3 .match-percent { color: #e09050; }

    .podium-info {
      padding: 1rem 1.2rem 1.3rem;
      background: var(--bg2);
    }
    .podium-name { font-size: 1.15rem; font-weight: 800; margin-bottom: .25rem; }
    .podium-tagline { font-size: .8rem; color: var(--muted); margin-bottom: .8rem; }
    .match-bar-track {
      height: 5px; background: rgba(255,255,255,.07); border-radius: 3px; overflow: hidden;
    }
    .match-bar-fill {
      height: 100%; background: var(--grad); border-radius: 3px;
      width: 0; transition: width 1.2s cubic-bezier(.4,0,.2,1);
    }

    /* All brands grid */
    .section-label {
      text-align: center; font-size: .78rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 1.5rem;
    }
    .brands-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.3rem; max-width: 1100px; margin: 0 auto;
    }

    .brand-card {
      border-radius: 1.25rem; overflow: hidden;
      border: 1.5px solid var(--border);
      background: var(--surface); cursor: pointer;
      transition: all .28s cubic-bezier(.4,0,.2,1);
      backdrop-filter: blur(8px);
    }
    .brand-card:hover {
      transform: translateY(-5px);
      border-color: rgba(79,142,247,.4);
      box-shadow: 0 15px 40px rgba(0,0,0,.4);
    }
    .brand-card-img {
      width: 100%; aspect-ratio: 16/9; overflow: hidden; position: relative;
    }
    .brand-card-img img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .5s; filter: brightness(.8) saturate(1.15);
    }
    .brand-card:hover .brand-card-img img { transform: scale(1.07); }
    .brand-card-img::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.7) 0%, transparent 60%);
    }

    .brand-card-body { padding: 1rem 1.15rem 1.25rem; }
    .brand-meta { display: flex; align-items: center; gap: .5rem; margin-bottom: .4rem; }
    .brand-country-flag { font-size: 1rem; }
    .brand-country-name { font-size: .75rem; color: var(--muted); }
    .brand-card-name { font-size: 1.05rem; font-weight: 800; margin-bottom: .2rem; }
    .brand-card-tagline { font-size: .8rem; color: var(--muted); margin-bottom: .8rem; }
    .brand-card-match {
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand-card-pct { font-size: .9rem; font-weight: 800; color: var(--blue); }
    .mini-bar-track { flex: 1; height: 4px; background: rgba(255,255,255,.07); border-radius: 2px; margin: 0 .8rem; overflow: hidden; }
    .mini-bar-fill { height: 100%; background: var(--grad); border-radius: 2px; width: 0; transition: width 1.2s .3s cubic-bezier(.4,0,.2,1); }

    .retry-wrap { text-align: center; margin-top: 4rem; }
    .btn-retry {
      background: none; border: 1.5px solid var(--border);
      border-radius: 999px; color: var(--text);
      padding: .8rem 2rem; font-size: .95rem; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: all .2s;
    }
    .btn-retry:hover { border-color: var(--blue); color: var(--blue); }

    /* ══════════════ MODAL ══════════════ */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.75); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }

    .modal {
      background: var(--bg2); border: 1.5px solid var(--border);
      border-radius: 1.8rem; overflow: hidden;
      max-width: 700px; width: 100%; max-height: 90vh;
      overflow-y: auto; transform: scale(.94) translateY(24px);
      transition: transform .35s cubic-bezier(.4,0,.2,1);
    }
    .modal-overlay.open .modal { transform: none; }

    .modal-hero { position: relative; width: 100%; aspect-ratio: 16/8; overflow: hidden; }
    .modal-hero img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.8) saturate(1.2); }
    .modal-hero::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, var(--bg2) 0%, transparent 50%);
    }
    .modal-hero-info {
      position: absolute; bottom: 1.5rem; left: 1.8rem; z-index: 1;
    }
    .modal-hero-name { font-size: 2rem; font-weight: 900; letter-spacing: -.02em; }
    .modal-hero-tagline { font-size: .9rem; color: rgba(255,255,255,.65); }

    .modal-close {
      position: absolute; top: 1rem; right: 1rem; z-index: 10;
      background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.15);
      color: #fff; width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s; backdrop-filter: blur(8px);
    }
    .modal-close:hover { background: rgba(255,255,255,.15); }

    .modal-body { padding: 1.4rem 1.8rem 2rem; }

    .modal-match-block {
      display: flex; align-items: center; gap: 1rem;
      background: rgba(79,142,247,.07); border: 1px solid rgba(79,142,247,.2);
      border-radius: 1rem; padding: 1rem 1.3rem; margin-bottom: 1.5rem;
    }
    .modal-match-pct { font-size: 2.2rem; font-weight: 900; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .modal-match-label { font-size: .85rem; color: var(--muted); }
    .modal-match-bar-track { flex: 1; height: 6px; background: rgba(255,255,255,.07); border-radius: 3px; overflow: hidden; }
    .modal-match-bar-fill { height: 100%; background: var(--grad); border-radius: 3px; width: 0; transition: width 1s .2s ease; }

    .modal-desc { font-size: .95rem; color: var(--muted); line-height: 1.75; margin-bottom: 1.8rem; }

    .modal-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.8rem; }
    @media(max-width:480px){ .modal-stats { grid-template-columns: 1fr; } }
    .stat-item { background: var(--surface); border: 1px solid var(--border); border-radius: .8rem; padding: .9rem 1rem; }
    .stat-label { font-size: .72rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: .3rem; }
    .stat-value { font-size: .95rem; font-weight: 700; }

    .modal-section-title { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); margin-bottom: .8rem; }

    .models-list {
      display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.8rem;
    }
    .model-chip {
      background: rgba(79,142,247,.1); border: 1px solid rgba(79,142,247,.25);
      color: var(--blue); border-radius: 999px;
      padding: .3rem .85rem; font-size: .82rem; font-weight: 600;
    }

    .pros-list { list-style: none; display: flex; flex-direction: column; gap: .5rem; }
    .pros-list li {
      font-size: .9rem; color: var(--muted); display: flex; gap: .6rem; align-items: flex-start;
    }
    .pros-list li::before { content: '✦'; color: var(--blue); flex-shrink: 0; font-size: .8rem; margin-top: .15rem; }

    /* ══════════════ ANIMATIONS ══════════════ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }

    .fade-in { animation: fadeUp .5s ease both; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }
  </style>
</head>
<body>

<!-- Background orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- ═══════════ HERO ═══════════ -->
<section id="hero">
  <div class="hero-bg">
    <img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=1600&q=80&auto=format&fit=crop" alt="Hero car" />
  </div>

  <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;">
    <div class="hero-badge">
      <span></span>
      나만의 자동차 브랜드 추천
    </div>

    <h1 class="hero-title">
      당신에게 완벽한<br/>
      <span class="grad">자동차 브랜드</span>는?
    </h1>

    <p class="hero-sub">
      4가지 간단한 질문에 답하면, 전문 알고리즘이 소비자
      기호에 맞는 자동차 브랜드를 사진과 함께 소개해드립니다.
    </p>

    <button class="btn-primary" id="startBtn" onclick="startQuiz()">
      <span class="btn-icon">🚗</span>
      지금 시작하기
    </button>

    <div class="hero-brands">
      <span class="hero-brand-chip">BMW</span><span class="sep">·</span>
      <span class="hero-brand-chip">Mercedes-Benz</span><span class="sep">·</span>
      <span class="hero-brand-chip">Porsche</span><span class="sep">·</span>
      <span class="hero-brand-chip">Tesla</span><span class="sep">·</span>
      <span class="hero-brand-chip">Genesis</span><span class="sep">·</span>
      <span class="hero-brand-chip">그 외 5개 브랜드</span>
    </div>
  </div>
</section>

<!-- ═══════════ QUIZ ═══════════ -->
<section id="quiz">
  <div class="quiz-wrap">
    <div class="quiz-header">
      <span class="quiz-step-label" id="stepLabel">질문 1 / 4</span>
      <button class="quiz-back-btn" id="backBtn" onclick="goBack()">← 이전</button>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:25%"></div>
    </div>
    <h2 class="quiz-q" id="quizQ"></h2>
    <p class="quiz-q-sub" id="quizSub"></p>
    <div class="options-grid" id="optionsGrid"></div>
    <div class="quiz-next-wrap">
      <button class="btn-next" id="nextBtn" onclick="nextStep()">
        다음 질문 →

    popularModels: ["XC60", "XC90", "S60", "EX30", "EX90"],
    pros: ["세계 최고 수준의 안전 기술", "북유럽 미니멀 감성 디자인", "BLIS 사각지대 경고 시스템 원조", "가족 친화적인 넓은 실내", "EX30·EX90 전기차 선택지"],
    scores: { commute:3, sports:1, family:5, offroad:2, low:0, mid:3, high:5, luxury:3, elegant:5, sporty:1, eco:4, safe:5, performance:1, prestige:3, tech:3, value:3 }
  }
];

// ════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════
let currentStep = 0;
let answers = {};

// ════════════════════════════════════════════
//  QUIZ LOGIC
// ════════════════════════════════════════════
function startQuiz() {
  document.getElementById("hero").style.display = "none";
  document.getElementById("quiz").classList.add("active");
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentStep];
  document.getElementById("stepLabel").textContent = `질문 ${currentStep + 1} / ${questions.length}`;
  document.getElementById("progressFill").style.width = `${((currentStep + 1) / questions.length) * 100}%`;
  document.getElementById("quizQ").textContent = q.q;
  document.getElementById("quizSub").textContent = q.sub;
  document.getElementById("backBtn").style.visibility = currentStep === 0 ? "hidden" : "visible";

  const grid = document.getElementById("optionsGrid");
  grid.innerHTML = "";

  const selected = answers[q.key];
  q.options.forEach((opt, i) => {
    const div = document.createElement("div");
    div.className = "option-card" + (selected === opt.value ? " selected" : "");
    div.style.animationDelay = `${i * 0.07}s`;
    div.innerHTML = `
      <div class="opt-icon">${opt.icon}</div>
      <div class="opt-texts">
        <div class="opt-title">${opt.title}</div>
        <div class="opt-desc">${opt.desc}</div>
      </div>`;
    div.addEventListener("click", () => selectOption(opt.value));
    grid.appendChild(div);
  });

  updateNextBtn();
}

function selectOption(value) {
  answers[questions[currentStep].key] = value;
  document.querySelectorAll(".option-card").forEach(c => c.classList.remove("selected"));
  const allOpts = document.querySelectorAll(".option-card");
  const q = questions[currentStep];
  const idx = q.options.findIndex(o => o.value === value);
  if (allOpts[idx]) allOpts[idx].classList.add("selected");
  updateNextBtn();
}

function updateNextBtn() {
  const btn = document.getElementById("nextBtn");
  const q = questions[currentStep];
  if (answers[q.key]) {
    btn.classList.add("visible");
    btn.textContent = currentStep === questions.length - 1 ? "결과 보기 🎉" : "다음 질문 →";
  } else {
    btn.classList.remove("visible");
  }
}

function nextStep() {
  if (!answers[questions[currentStep].key]) return;
  if (currentStep < questions.length - 1) {
    currentStep++;
    renderQuestion();
  } else {
    showResults();
  }
}

function goBack() {
  if (currentStep > 0) {
    currentStep--;
    renderQuestion();
  }
}

// ════════════════════════════════════════════
//  SCORING
// ════════════════════════════════════════════
function calcScores() {
  return brands.map(b => {
    const s = b.scores;
    const raw = (s[answers.purpose] || 0) + (s[answers.budget] || 0) + (s[answers.style] || 0) + (s[answers.priority] || 0);
    return { ...b, raw };
  }).sort((a, b) => b.raw - a.raw);
}

// ════════════════════════════════════════════
//  RESULTS
// ════════════════════════════════════════════
function showResults() {
  document.getElementById("quiz").classList.remove("active");
  const res = document.getElementById("results");
  res.classList.add("active");

  const scored = calcScores();
  const maxRaw = scored[0].raw;

  // Sub-text
  const top = scored[0];
  const purposeLabel = { commute:"도심 주행", sports:"스포츠 퍼포먼스", family:"가족 레저", offroad:"오프로드 어드벤처" };
  document.getElementById("resultsSub").textContent =
    `${purposeLabel[answers.purpose]} · ${answers.budget === "low" ? "3천만원 이하" : answers.budget === "mid" ? "3천~6천만원" : answers.budget === "high" ? "6천~1억" : "1억 이상"} 예산 기준으로 분석했습니다`;

  // Podium (top 3)
  const podium = document.getElementById("podium");
  podium.innerHTML = "";
  const rankLabel = ["🥇 1위", "🥈 2위", "🥉 3위"];
  const rankClass = ["rank-1", "rank-2", "rank-3"];

  [scored[0], scored[1], scored[2]].forEach((b, i) => {
    const pct = Math.round((b.raw / maxRaw) * 100);
    const div = document.createElement("div");
    div.className = `podium-card ${rankClass[i]} fade-in`;
    div.style.animationDelay = `${i * 0.12}s`;
    div.onclick = () => openModal(b, pct);
    div.innerHTML = `
      <div class="podium-img-wrap">
        <span class="podium-rank-badge">${rankLabel[i]}</span>
        <img src="${b.image}" alt="${b.name}" loading="lazy" onerror="this.style.background='#1a1a2e';this.src=''"/>
        <div class="match-percent">${pct}%</div>
      </div>
      <div class="podium-info">
        <div class="podium-name">${b.flag} ${b.name}</div>
        <div class="podium-tagline">${b.tagline}</div>
        <div class="match-bar-track">
          <div class="match-bar-fill" data-pct="${pct}"></div>
        </div>
      </div>`;
    podium.appendChild(div);
  });

  // All brands grid
  const grid = document.getElementById("brandsGrid");
  grid.innerHTML = "";
  scored.forEach((b, i) => {
    const pct = Math.round((b.raw / maxRaw) * 100);
    const div = document.createElement("div");
    div.className = "brand-card fade-in";
    div.style.animationDelay = `${i * 0.06}s`;
    div.onclick = () => openModal(b, pct);
    div.innerHTML = `
      <div class="brand-card-img">
        <img src="${b.image}" alt="${b.name}" loading="lazy" onerror="this.style.background='#1a1a2e';this.src=''"/>
      </div>
      <div class="brand-card-body">
        <div class="brand-meta">
          <span class="brand-country-flag">${b.flag}</span>
          <span class="brand-country-name">${b.country} · ${b.segment}</span>
        </div>
        <div class="brand-card-name">${b.name}</div>
        <div class="brand-card-tagline">${b.tagline}</div>
        <div class="brand-card-match">
          <span class="brand-card-pct">${pct}%</span>
          <div class="mini-bar-track"><div class="mini-bar-fill" data-pct="${pct}"></div></div>
          <span style="font-size:.75rem;color:var(--muted)">#${i+1}</span>
        </div>
      </div>`;
    grid.appendChild(div);
  });

  // Animate bars after render
  setTimeout(() => {
    document.querySelectorAll(".match-bar-fill, .mini-bar-fill").forEach(el => {
      el.style.width = el.dataset.pct + "%";
    });
  }, 200);

  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ════════════════════════════════════════════
//  MODAL
// ════════════════════════════════════════════
function openModal(brand, pct) {
  document.getElementById("modalImg").src = brand.image;
  document.getElementById("modalImg").alt = brand.name;
  document.getElementById("modalName").textContent = `${brand.flag} ${brand.name}`;
  document.getElementById("modalTagline").textContent = brand.tagline;
  document.getElementById("modalPct").textContent = pct + "%";
  document.getElementById("modalDesc").textContent = brand.description;

  // Stats
  document.getElementById("modalStats").innerHTML = `
    <div class="stat-item"><div class="stat-label">🌍 생산국</div><div class="stat-value">${brand.country}</div></div>
    <div class="stat-item"><div class="stat-label">📅 설립연도</div><div class="stat-value">${brand.founded}년</div></div>
    <div class="stat-item"><div class="stat-label">💰 가격대</div><div class="stat-value">${brand.priceRange}</div></div>
    <div class="stat-item"><div class="stat-label">🏷️ 세그먼트</div><div class="stat-value">${brand.segment}</div></div>
  `;

  // Models
  document.getElementById("modalModels").innerHTML = brand.popularModels.map(m =>
    `<span class="model-chip">${m}</span>`).join("");

  // Pros
  document.getElementById("modalPros").innerHTML = brand.pros.map(p =>
    `<li>${p}</li>`).join("");

  const overlay = document.getElementById("modalOverlay");
  overlay.classList.add("open");
  document.body.style.overflow = "hidden";

  setTimeout(() => {
    document.getElementById("modalBar").style.width = pct + "%";
  }, 200);
}

function closeModal(e) {
  if (e.target === document.getElementById("modalOverlay")) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById("modalOverlay").classList.remove("open");
  document.getElementById("modalBar").style.width = "0";
  document.body.style.overflow = "";
}

// ════════════════════════════════════════════
//  RESTART
// ════════════════════════════════════════════
function restartQuiz() {
  currentStep = 0;
  answers = {};
  document.getElementById("results").classList.remove("active");
  document.getElementById("hero").style.display = "";
  document.getElementById("quiz").classList.remove("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// keyboard close
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModalDirect();
});
</script>
</body>
</html>
